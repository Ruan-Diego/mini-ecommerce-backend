name: CI

# ADR-0004: CI só roda em PR para main (fim de cada fase) ou manualmente.
# Não adicione gatilho de push nem de PR para dev/feat: a cota de Actions é limitada.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build e testes (inclui ArchUnit)
        run: ./gradlew build --no-daemon
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
