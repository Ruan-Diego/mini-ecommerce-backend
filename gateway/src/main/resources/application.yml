server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emissor esperado no claim iss (o que o navegador enxerga) e onde buscar as chaves públicas.
          # Separados porque, no container, o Keycloak não é "localhost". Nada é buscado na subida.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mini}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mini/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:5173" # shell
                  - "http://localhost:5174" # mfe-catalogo
                  - "http://localhost:5175" # mfe-carrinho
                  - "http://localhost:5176" # mfe-checkout
                  - "http://localhost:5177" # mfe-conta
                  - "http://localhost:5178" # mfe-admin
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: ["*"]
          routes:
            - id: catalogo
              uri: ${CATALOGO_URL:http://localhost:8081}
              predicates:
                - Path=/api/catalogo/**
              filters:
                - StripPrefix=2

            - id: carrinho
              uri: ${CARRINHO_URL:http://localhost:8082}
              predicates:
                - Path=/api/carrinho/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
