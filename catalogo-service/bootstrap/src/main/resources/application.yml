server:
  port: 8081

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/catalogo
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD:catalogo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
