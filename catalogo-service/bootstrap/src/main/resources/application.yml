server:
  port: 8081

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/catalogo
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD:catalogo}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mini}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mini/protocol/openid-connect/certs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # O relay só dá baixa na outbox depois que o broker confirma o recebimento.
    publisher-confirm-type: correlated
  flyway:
    enabled: true

  servlet:
    multipart:
      # Upload de imagem: até 2 MB por arquivo (o ArquivoImagem confere de novo, com mensagem própria).
      max-file-size: 2MB
      max-request-size: 3MB

catalogo:
  imagens:
    # Onde os arquivos enviados pelo admin ficam e por qual URL pública são servidos (GET /imagens/{arquivo}).
    # A URL é a do gateway, que repassa /api/catalogo/** para este serviço.
    diretorio: ${CATALOGO_IMAGENS_DIRETORIO:./dados/imagens}
    url-publica: ${CATALOGO_IMAGENS_URL:http://localhost:8080/api/catalogo/imagens}
  outbox:
    # Intervalo entre rodadas do relay, em milissegundos.
    intervalo: 1000
    relay-ligado: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Métricas para o Prometheus (/actuator/prometheus). O histograma do HTTP permite calcular p95 no Grafana.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

mini:
  eventos:
    # Tipos de evento que este serviço publica: os contadores mini_eventos_publicados_total nascem com 0.
    tipos: catalogo.preco-alterado
