server:
  port: 8083

spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pedido
    username: ${DB_USER:pedido}
    password: ${DB_PASSWORD:pedido}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # O relay só dá baixa na outbox depois que o broker confirma o recebimento.
    publisher-confirm-type: correlated
    listener:
      simple:
        # 3 tentativas com espera crescente (1 s, 2 s). Esgotadas, a mensagem é rejeitada sem voltar à fila e o
        # broker a manda para a DLQ (a fila tem x-dead-letter-exchange, veja RabbitConsumoConfig).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mini}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mini/protocol/openid-connect/certs}

frete:
  # Qual adapter do port CalculadoraFrete vale: fixo (padrão, sem rede) ou melhorenvio.
  # A troca é só esta propriedade: domain e application não mudam.
  provedor: ${FRETE_PROVEDOR:fixo}
  melhorenvio:
    # Só lidas com provedor=melhorenvio. Token do sandbox do Melhor Envio (nunca o de produção).
    url: ${MELHORENVIO_URL:https://sandbox.melhorenvio.com.br}
    token: ${MELHORENVIO_TOKEN:}
    cep-origem: ${MELHORENVIO_CEP_ORIGEM:}
    user-agent: ${MELHORENVIO_USER_AGENT:Mini Ecommerce (contato@exemplo.com)}
    # Timeout do cliente HTTP e retry; esgotadas as tentativas, cai no frete fixo.
    timeout-conexao-ms: 2000
    timeout-leitura-ms: 3000
    tentativas: 3
    espera-entre-tentativas-ms: 300

pedido:
  # API do catalogo-service, de onde vêm nome e preço dos produtos.
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8081}
  outbox:
    # Intervalo entre rodadas do relay, em milissegundos.
    intervalo: 1000
    relay-ligado: true
  expiracao:
    # Intervalo entre rodadas do job que cancela os pedidos sem pagamento há 30 minutos, em milissegundos.
    intervalo: 60000
    ligada: true

loja:
  # Fuso da loja: define o que é "hoje" nos indicadores do admin e as datas do filtro de pedidos.
  fuso: ${LOJA_FUSO:America/Sao_Paulo}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
