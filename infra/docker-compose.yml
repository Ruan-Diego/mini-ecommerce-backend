name: mini-ecommerce

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # A imagem do Keycloak não tem curl: o bash abre a conexão HTTP na porta de management (9000).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Perfil "apps": não sobe com a infra (docker compose up -d), só com --profile apps.
  # Antes, gere o jar: .\gradlew.bat :gateway:bootJar
  # Os serviços rodam no host (bootRun) durante o desenvolvimento; o gateway os alcança por host.docker.internal.
  gateway:
    profiles: [apps]
    build: ../gateway
    environment:
      CATALOGO_URL: ${CATALOGO_URL:-http://host.docker.internal:8081}
      CARRINHO_URL: ${CARRINHO_URL:-http://host.docker.internal:8082}
      PEDIDO_URL: ${PEDIDO_URL:-http://host.docker.internal:8083}
      PAGAMENTO_URL: ${PAGAMENTO_URL:-http://host.docker.internal:8084}
      ESTOQUE_URL: ${ESTOQUE_URL:-http://host.docker.internal:8085}
      # O token vem do navegador com iss = localhost:8180; as chaves, o container busca no serviço do Compose.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/mini
      KEYCLOAK_JWKS: http://keycloak:8080/realms/mini/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    # A imagem temurin traz curl; -f faz o 503 (health DOWN) contar como falha.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
