server:
  port: 8084

spring:
  application:
    name: pagamento-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pagamento
    username: ${DB_USER:pagamento}
    password: ${DB_PASSWORD:pagamento}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # O relay só dá baixa na outbox depois que o broker confirma o recebimento.
    publisher-confirm-type: correlated
    listener:
      simple:
        # 3 tentativas com espera crescente (1 s, 2 s). Esgotadas, a mensagem é rejeitada sem voltar à fila e o
        # broker a manda para a DLQ (a fila tem x-dead-letter-exchange, veja RabbitConsumoConfig).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mini}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mini/protocol/openid-connect/certs}

pagamento:
  # Qual adapter do port GatewayPagamento vale: fake (padrão, sem rede) ou mercadopago (sandbox).
  # A troca é só esta propriedade: domain e application não mudam.
  gateway: ${PAGAMENTO_GATEWAY:fake}
  mercadopago:
    # Só lidas com gateway=mercadopago. Credenciais de TESTE do painel do Mercado Pago (nunca as de produção).
    url: ${MERCADOPAGO_URL:https://api.mercadopago.com}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    email-pagador: ${MERCADOPAGO_EMAIL_PAGADOR:test_user@testuser.com}
    # URL pública deste serviço para o Mercado Pago avisar (ex.: túnel ngrok .../api/pagamentos/webhooks/gateway).
    url-notificacao: ${MERCADOPAGO_URL_NOTIFICACAO:}
  webhook:
    # Segredo compartilhado com o gateway de pagamento (cabeçalho X-Webhook-Segredo). O valor padrão é só
    # para desenvolvimento local: em qualquer outro ambiente, defina WEBHOOK_SEGREDO.
    segredo: ${WEBHOOK_SEGREDO:dev-segredo-do-webhook}
  outbox:
    # Intervalo entre rodadas do relay, em milissegundos.
    intervalo: 1000
    relay-ligado: true
  pix:
    # Intervalo entre rodadas que expiram os Pix com mais de 30 minutos, em milissegundos.
    intervalo-de-expiracao: 60000
    expiracao-ligada: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Métricas para o Prometheus (/actuator/prometheus). O histograma do HTTP permite calcular p95 no Grafana.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

mini:
  eventos:
    # Tipos de evento que este serviço publica: os contadores mini_eventos_publicados_total nascem com 0.
    tipos: pagamento.aprovado,pagamento.recusado,pagamento.estornado
