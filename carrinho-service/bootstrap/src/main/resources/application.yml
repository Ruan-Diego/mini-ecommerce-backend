server:
  port: 8082

spring:
  application:
    name: carrinho-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/carrinho
    username: ${DB_USER:carrinho}
    password: ${DB_PASSWORD:carrinho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 3 tentativas com espera crescente (1 s, 2 s). Esgotadas, a mensagem é rejeitada sem voltar à fila e o
        # broker a manda para a DLQ (a fila tem x-dead-letter-exchange, veja RabbitConfig).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/mini}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/mini/protocol/openid-connect/certs}

carrinho:
  # Carrinho de visitante: some depois de 7 dias sem uso (cada gravação renova o prazo).
  visitante:
    ttl: 7d
  # API do catalogo-service, de onde vêm nome e preço dos produtos.
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8081}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Métricas para o Prometheus (/actuator/prometheus). O histograma do HTTP permite calcular p95 no Grafana.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
